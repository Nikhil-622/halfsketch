<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="A kraft envelope tied with twine, sealed with pink wax, among autumn leaves">
  <defs>
    <filter id="wash" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="6"/>
      <feDisplacementMap in="SourceGraphic" scale="7"/>
    </filter>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.22  0 0 0 0.1 0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>

    <path id="env" d="M190,330 H810 V760 H190 Z" transform="rotate(-5 500 545)"/>
    <path id="card" d="M250,250 H690 V560 H250 Z" transform="rotate(4 470 405)"/>
    <path id="flapL" d="M190,760 L500,540 L190,330 Z" transform="rotate(-5 500 545)"/>
    <path id="flapR" d="M810,760 L500,540 L810,330 Z" transform="rotate(-5 500 545)"/>
    <path id="flapB" d="M190,760 L500,520 L810,760 Z" transform="rotate(-5 500 545)"/>
    <path id="leaf" d="M0,0 C30,-30 70,-40 110,-20 C80,10 40,25 0,0 Z"/>
    <path id="maple" d="M0,-70 L14,-34 L50,-46 L34,-12 L66,4 L28,14 L34,50 L0,28 L-34,50 L-28,14 L-66,4 L-34,-12 L-50,-46 L-14,-34 Z"/>
  </defs>

  <rect width="1000" height="1000" fill="#F1ECE5"/>
  <g filter="url(#soft)" opacity="0.7">
    <ellipse cx="500" cy="560" rx="380" ry="300" fill="#E8DCCB"/>
    <ellipse cx="820" cy="180" rx="200" ry="160" fill="#F3DDD6"/>
  </g>

  <g filter="url(#wash)">
    <!-- leaves scattered behind -->
    <use href="#maple" transform="translate(150 210) rotate(-20) scale(1.3)" fill="#D8743A"/>
    <use href="#maple" transform="translate(860 820) rotate(25) scale(1.5)" fill="#D9A441"/>
    <use href="#leaf" transform="translate(800 230) rotate(140) scale(1.4)" fill="#B9653F"/>
    <use href="#leaf" transform="translate(120 820) rotate(-40) scale(1.5)" fill="#8FA472"/>

    <use href="#env" fill="#D9B48A"/>
    <!-- a blank card peeking out: the real artwork goes on the product photos, not here -->
    <use href="#card" fill="#FBF6EE"/>
    <use href="#flapL" fill="#CFA77B"/>
    <use href="#flapR" fill="#CFA77B"/>
    <use href="#flapB" fill="#D4AE84"/>
    <!-- twine -->
    <path d="M160,600 Q500,520 840,500" stroke="#F7EFE3" stroke-width="9" fill="none"/>
    <!-- wax seal -->
    <circle cx="505" cy="560" r="62" fill="#F184A2"/>
    <circle cx="505" cy="560" r="42" fill="#E0668A"/>
    <use href="#maple" transform="translate(505 562) scale(0.42)" fill="#F4A6BB"/>

    <use href="#maple" transform="translate(760 400) rotate(10) scale(0.9)" fill="#D8743A"/>
    <use href="#leaf" transform="translate(230 720) rotate(-150) scale(1.1)" fill="#D9A441"/>
  </g>

  <g filter="url(#pencil)" transform="translate(4 -3)" fill="none" stroke="#2A2421" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <use href="#env"/>
    <use href="#card"/>
    <use href="#flapL"/>
    <use href="#flapR"/>
    <use href="#flapB"/>
    <circle cx="505" cy="560" r="62"/>
    <path d="M160,600 Q500,520 840,500" stroke-width="1.6"/>
    <path d="M470,548 q-30,-40 -60,-30 q10,30 60,30 M540,548 q30,-40 60,-30 q-10,30 -60,30" stroke-width="2"/>
    <use href="#maple" transform="translate(150 210) rotate(-20) scale(1.3)" stroke-width="2"/>
    <use href="#maple" transform="translate(760 400) rotate(10) scale(0.9)" stroke-width="2"/>
    <use href="#maple" transform="translate(860 820) rotate(25) scale(1.5)" stroke-width="2"/>
    <!-- postmark-style circle, decorative -->
    <circle cx="690" cy="680" r="48" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M650,670 h80 M650,690 h80" stroke-width="1.6"/>
  </g>
  <text x="300" y="350" transform="rotate(4 470 405)" font-family="'Mrs Saint Delafield','Caveat',cursive" font-size="64" fill="#2A2421">Dear you,</text>

  <rect width="1000" height="1000" filter="url(#grain)"/>
</svg>
